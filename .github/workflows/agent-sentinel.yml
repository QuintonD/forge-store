name: agent-sentinel

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-sentinel

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sentinel patrol (attestation + demo gates)
        id: patrol
        continue-on-error: true
        run: node scripts/agents/sentinel.mjs | tee sentinel-output.txt

      - name: Open incident issue on findings
        if: steps.patrol.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('sentinel-output.txt')
              ? fs.readFileSync('sentinel-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sentinel: ${new Date().toISOString().slice(0, 10)} — gates failing`,
              labels: ['agent', 'incident'],
              body: [
                'Sentinel patrol found gate violations. A human must confirm takedown/reinstatement.',
                '',
                '```',
                output.slice(0, 6000),
                '```',
                '',
                'Incident draft (if written locally) lands in content/queue on the next agent-content run.',
              ].join('\n'),
            })
